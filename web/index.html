<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPECTRA — Universal Hardware Telemetry & Logic Diagnostics</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self';" />
  </head>
  <body class="bg-black text-gray-100 overflow-x-hidden select-none">
    <div id="root">
      <div id="spectra-boot-splash" style="position:fixed;inset:0;background:#09090b;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,monospace;user-select:none;-webkit-user-select:none;">
        <div style="position:relative;width:96px;height:96px;margin-bottom:24px;">
          <!-- SPECTRA Hexagonal Prism Logo SVG -->
          <svg viewBox="0 0 100 100" style="width:100%;height:100%;filter:drop-shadow(0 0 16px rgba(6,182,212,0.6));">
            <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="16 6" />
            <polygon points="50,15 80,30 80,70 50,85 20,70 20,30" fill="#0e0e12" stroke="#3b82f6" stroke-width="2" />
            <circle cx="50" cy="50" r="14" fill="#0891b2" opacity="0.8" />
            <polygon points="50,28 68,64 32,64" fill="none" stroke="#22d3ee" stroke-width="2" />
          </svg>
        </div>
        <div style="font-size:24px;font-weight:800;letter-spacing:0.18em;color:#ffffff;text-shadow:0 0 20px rgba(6,182,212,0.7);margin-bottom:6px;">SPECTRA</div>
        <div style="font-size:11px;font-weight:600;letter-spacing:0.12em;color:#94a3b8;text-transform:uppercase;margin-bottom:20px;text-align:center;max-width:380px;">Hardware Telemetry &amp; Logic Board Diagnostics</div>
        <div style="width:220px;height:4px;background:#18181b;border-radius:2px;overflow:hidden;position:relative;box-shadow:0 0 8px rgba(6,182,212,0.3);">
          <div style="width:45%;height:100%;background:linear-gradient(90deg, #06b6d4, #3b82f6);border-radius:2px;animation:spectra-loading 1.2s infinite ease-in-out;"></div>
        </div>
        <div style="font-size:10px;font-weight:500;letter-spacing:0.15em;color:#06b6d4;margin-top:14px;opacity:0.9;">INITIALIZING HARDWARE ENGINE...</div>
        <style>
          @keyframes spectra-loading {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(120%); }
            100% { transform: translateX(250%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
