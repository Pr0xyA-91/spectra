[workspace]
resolver = "2"
members = [
    "crates/spectra-hal",
    "crates/spectra-core",
    "crates/spectra-agent",
    "crates/spectra-py",
    "crates/spectra-shell",
]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-serial = "5.4"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
pyo3 = { version = "0.29", features = ["abi3-py39"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
