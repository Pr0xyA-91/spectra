<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090F"/>
      <stop offset="100%" stop-color="#0E1320"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="700" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="1168" height="668" rx="10" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header Title -->
  <text x="40" y="52" fill="#06B6D4" font-size="18" font-weight="bold" letter-spacing="1.5">SPECTRA WORKSTATION OVERVIEW &amp; HARDWARE WORKFLOW</text>
  <text x="40" y="72" fill="#94A3B8" font-size="11.5">Universal Hardware Telemetry, Logic Board Diagnostics &amp; Real-Time Workbench (Build 20261114.0020)</text>
  <rect x="975" y="34" width="185" height="28" rx="5" fill="#0F172A" stroke="#06B6D4" stroke-width="1"/>
  <text x="1067" y="52" fill="#67E8F9" font-size="11" font-weight="bold" text-anchor="middle">NATIVE SHELL / WEB UI</text>

  <!-- Step 1: Hardware Connection Panel (Top) -->
  <rect x="40" y="92" width="1120" height="122" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
  <text x="56" y="114" fill="#FCEE09" font-size="12" font-weight="bold">STEP 1 — HARDWARE LINK &amp; GALVANIC ISOLATION</text>

  <!-- Option A -->
  <rect x="56" y="124" width="335" height="76" rx="6" fill="#090D16" stroke="#06B6D4" stroke-width="1"/>
  <text x="70" y="144" fill="#67E8F9" font-size="11.5" font-weight="bold">Option A: JURA USB Scanner (N 010)</text>
  <text x="70" y="162" fill="#CBD5E1" font-size="10.5">Linux: /dev/ttyUSB0  •  Windows: COMx</text>
  <text x="70" y="178" fill="#94A3B8" font-size="10">Optical loopback echo auto-stripped (9600 8N1)</text>

  <!-- Option B -->
  <rect x="408" y="124" width="365" height="76" rx="6" fill="#090D16" stroke="#3B82F6" stroke-width="1"/>
  <text x="422" y="144" fill="#93C5FD" font-size="11.5" font-weight="bold">Option B: 5V TTL UART (4-Pin Service Port)</text>
  <text x="422" y="162" fill="#CBD5E1" font-size="10.5">Pin 1: GND -&gt; GND   |   Pin 2: TX -&gt; Adapter RX</text>
  <text x="422" y="178" fill="#FCA5A5" font-size="10">Pin 3: RX -&gt; TX     |   Pin 4: +5V DO NOT CONNECT</text>

  <!-- Safety Warning -->
  <rect x="790" y="124" width="354" height="76" rx="6" fill="#2A0F14" stroke="#F43F5E" stroke-width="1.2"/>
  <text x="804" y="144" fill="#FDA4AF" font-size="11.5" font-weight="bold">SAFETY: USE USB GALVANIC ISOLATION</text>
  <text x="804" y="162" fill="#FECDD3" font-size="10">Legacy coffee logic boards often use non-isolated</text>
  <text x="804" y="178" fill="#FECDD3" font-size="10">AC dropper supplies. Use ADuM3160 / ADuM4160!</text>

  <!-- Simulated Top Bar -->
  <rect x="40" y="230" width="1120" height="70" rx="8" fill="#111827" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="56" y="248" fill="#94A3B8" font-size="10" font-weight="bold">STEP 2 — TOP CONTROL BAR (PORT, LIVE POLLING, FULL EEPROM READ &amp; CONFIGURATION)</text>

  <!-- Controls -->
  <rect x="56" y="258" width="165" height="30" rx="4" fill="#090D16" stroke="#334155"/>
  <circle cx="70" cy="273" r="4" fill="#10B981"/>
  <text x="82" y="277" fill="#E2E8F0" font-size="10.5">COM3 / DEMO (S8)</text>

  <rect x="229" y="258" width="84" height="30" rx="4" fill="#0C4A6E" stroke="#0284C7"/>
  <text x="271" y="277" fill="#7DD3FC" font-size="10.5" font-weight="bold" text-anchor="middle">REFRESH</text>

  <rect x="321" y="258" width="90" height="30" rx="4" fill="#064E3B" stroke="#10B981"/>
  <text x="366" y="277" fill="#6EE7B7" font-size="10.5" font-weight="bold" text-anchor="middle">POLLING</text>

  <rect x="419" y="258" width="128" height="30" rx="4" fill="#4C1D95" stroke="#A855F7"/>
  <text x="483" y="277" fill="#F3E8FF" font-size="10.5" font-weight="bold" text-anchor="middle">INTERROGATE</text>

  <rect x="555" y="258" width="82" height="30" rx="4" fill="#1E293B" stroke="#475569"/>
  <text x="596" y="277" fill="#E2E8F0" font-size="10.5" font-weight="bold" text-anchor="middle">REPORT</text>

  <rect x="645" y="258" width="82" height="30" rx="4" fill="#1E293B" stroke="#475569"/>
  <text x="686" y="277" fill="#E2E8F0" font-size="10.5" font-weight="bold" text-anchor="middle">EXPORT</text>

  <rect x="735" y="258" width="160" height="30" rx="4" fill="#083344" stroke="#06B6D4"/>
  <text x="815" y="277" fill="#67E8F9" font-size="10" font-weight="bold" text-anchor="middle">FIRMWARE INSPECTOR</text>

  <rect x="903" y="258" width="76" height="30" rx="4" fill="#18181B" stroke="#52525B"/>
  <text x="941" y="277" fill="#A1A1AA" font-size="10.5" font-weight="bold" text-anchor="middle">AI: OFF</text>

  <rect x="987" y="258" width="80" height="30" rx="4" fill="#18181B" stroke="#FCEE09"/>
  <text x="1027" y="277" fill="#FCEE09" font-size="10.5" font-weight="bold" text-anchor="middle">CONFIG</text>

  <rect x="1075" y="258" width="72" height="30" rx="4" fill="#18181B" stroke="#64748B"/>
  <text x="1111" y="277" fill="#CBD5E1" font-size="10" font-weight="bold" text-anchor="middle">AUTO</text>

  <!-- 9 KPI Cards -->
  <text x="40" y="324" fill="#94A3B8" font-size="10" font-weight="bold">LIVE TELEMETRY STRIP (2s POLLING UPDATES HZ: SENSORS &amp; SWITCHES WITHOUT STALLING EEPROM)</text>
  <g font-size="9.5">
    <rect x="40" y="334" width="118" height="58" rx="5" fill="#0F172A" stroke="#334155"/>
    <text x="50" y="351" fill="#94A3B8">TOTAL PREPS</text>
    <text x="50" y="373" fill="#38BDF8" font-size="14" font-weight="bold">5,232</text>

    <rect x="165" y="334" width="118" height="58" rx="5" fill="#0F172A" stroke="#334155"/>
    <text x="175" y="351" fill="#94A3B8">TB1 HEATER</text>
    <text x="175" y="373" fill="#FBBF24" font-size="14" font-weight="bold">92.4 °C</text>

    <rect x="290" y="334" width="118" height="58" rx="5" fill="#0F172A" stroke="#334155"/>
    <text x="300" y="351" fill="#94A3B8">BU ENCODER</text>
    <text x="300" y="373" fill="#A855F7" font-size="13" font-weight="bold">226 / 638</text>

    <rect x="415" y="334" width="118" height="58" rx="5" fill="#0F172A" stroke="#334155"/>
    <text x="425" y="351" fill="#94A3B8">WATER FLOW</text>
    <text x="425" y="373" fill="#06B6D4" font-size="13" font-weight="bold">0.0 ml/s</text>

    <rect x="540" y="334" width="118" height="58" rx="5" fill="#0F172A" stroke="#334155"/>
    <text x="550" y="351" fill="#94A3B8">WATER TANK</text>
    <text x="550" y="373" fill="#10B981" font-size="12" font-weight="bold">WATER OK</text>

    <rect x="665" y="334" width="118" height="58" rx="5" fill="#0F172A" stroke="#334155"/>
    <text x="675" y="351" fill="#94A3B8">DRIP TRAY</text>
    <text x="675" y="373" fill="#10B981" font-size="12" font-weight="bold">INSERTED</text>

    <rect x="790" y="334" width="118" height="58" rx="5" fill="#0F172A" stroke="#334155"/>
    <text x="800" y="351" fill="#94A3B8">BEAN HOPPER</text>
    <text x="800" y="373" fill="#10B981" font-size="11" font-weight="bold">LOCAL/OK</text>

    <rect x="915" y="334" width="118" height="58" rx="5" fill="#0F172A" stroke="#334155"/>
    <text x="925" y="351" fill="#94A3B8">CLEANINGS</text>
    <text x="925" y="373" fill="#F472B6" font-size="14" font-weight="bold">84</text>

    <rect x="1040" y="334" width="120" height="58" rx="5" fill="#0F172A" stroke="#334155"/>
    <text x="1050" y="351" fill="#94A3B8">DECALCS</text>
    <text x="1050" y="373" fill="#34D399" font-size="14" font-weight="bold">21</text>
  </g>

  <!-- Step 3: 9 Diagnostic Tabs Grid -->
  <text x="40" y="420" fill="#FCEE09" font-size="12" font-weight="bold">STEP 3 — 9 DIAGNOSTIC WORKSPACE TABS</text>

  <!-- Row 1 -->
  <rect x="40" y="434" width="360" height="72" rx="6" fill="#131B2E" stroke="#FCEE09" stroke-width="1.5"/>
  <text x="56" y="456" fill="#FCEE09" font-size="12" font-weight="bold">01 // OVERVIEW</text>
  <text x="56" y="474" fill="#CBD5E1" font-size="10.5">Health Scorecard, Beverage Analytics, AI Triage,</text>
  <text x="56" y="490" fill="#94A3B8" font-size="10">Customer Summary &amp; CSV/Image Offset Calibrator</text>

  <rect x="420" y="434" width="360" height="72" rx="6" fill="#111827" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="436" y="456" fill="#67E8F9" font-size="12" font-weight="bold">02 // SENSORS &amp; OSCILLOSCOPE</text>
  <text x="436" y="474" fill="#CBD5E1" font-size="10.5">Live P&amp;ID Digital Twin Schematic, TB1/TB2 Temp</text>
  <text x="436" y="490" fill="#94A3B8" font-size="10">Strip Charts, Flow Meter &amp; NTC Shunt Self-Test</text>

  <rect x="800" y="434" width="360" height="72" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="816" y="456" fill="#38BDF8" font-size="12" font-weight="bold">03 // BEVERAGES</text>
  <text x="816" y="474" fill="#CBD5E1" font-size="10.5">Complete Decoded Specialty Counter Table,</text>
  <text x="816" y="490" fill="#94A3B8" font-size="10">Double-Cup Flags &amp; Percentage Share Bars</text>

  <!-- Row 2 -->
  <rect x="40" y="518" width="360" height="72" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="56" y="540" fill="#34D399" font-size="12" font-weight="bold">04 // MAINTENANCE</text>
  <text x="56" y="558" fill="#CBD5E1" font-size="10.5">Cleanings, Descalings, Filter Changes, Grinder</text>
  <text x="56" y="574" fill="#94A3B8" font-size="10">Life &amp; Remaining Capacity Progress Gauges</text>

  <rect x="420" y="518" width="360" height="72" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="436" y="540" fill="#FB7185" font-size="12" font-weight="bold">05 // ALERTS</text>
  <text x="436" y="558" fill="#CBD5E1" font-size="10.5">Live Hydraulic Lockouts vs Historical EEPROM</text>
  <text x="436" y="574" fill="#94A3B8" font-size="10">Fault Latch (RE:0028) &amp; Filling Loop Detection</text>

  <rect x="800" y="518" width="360" height="72" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="816" y="540" fill="#A78BFA" font-size="12" font-weight="bold">06 // IDENTITY</text>
  <text x="816" y="558" fill="#CBD5E1" font-size="10.5">14-Digit Serial Number, Article No, EF Code,</text>
  <text x="816" y="574" fill="#94A3B8" font-size="10">Production Date, Sub-MCU Type &amp; Water Hardness</text>

  <!-- Row 3 -->
  <rect x="40" y="602" width="360" height="72" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="56" y="624" fill="#F59E0B" font-size="12" font-weight="bold">07 // COMMAND INJECTOR</text>
  <text x="56" y="642" fill="#CBD5E1" font-size="10.5">Serialized Read-Safe UART Command Console</text>
  <text x="56" y="658" fill="#94A3B8" font-size="10">(TY:, HZ:, RT:, RE:, $: Display Sub-Bus Probe)</text>

  <rect x="420" y="602" width="360" height="72" rx="6" fill="#111827" stroke="#F43F5E" stroke-width="1"/>
  <text x="436" y="624" fill="#FDA4AF" font-size="12" font-weight="bold">08 // MEM MAPPER</text>
  <text x="436" y="642" fill="#CBD5E1" font-size="10.5">512-Word Differential EEPROM Matrix, Snapshot</text>
  <text x="436" y="658" fill="#94A3B8" font-size="10">Diff Heatmap &amp; Raw Bitfield Comparator</text>

  <rect x="800" y="602" width="360" height="72" rx="6" fill="#111827" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="816" y="624" fill="#67E8F9" font-size="12" font-weight="bold">09 // FIRMWARE INSPECTOR</text>
  <text x="816" y="642" fill="#CBD5E1" font-size="10.5">ELF32, APK &amp; MCU Firmware Inspector, 3-Tier</text>
  <text x="816" y="658" fill="#94A3B8" font-size="10">Localization Auditor &amp; Non-Destructive Patcher</text>
</svg>
