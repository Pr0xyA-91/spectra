<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090F"/>
      <stop offset="100%" stop-color="#0E1525"/>
    </linearGradient>
    <marker id="arrC" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L6,4 L0,7 Z" fill="#06B6D4"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L6,4 L0,7 Z" fill="#A855F7"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="url(#bg4)"/>
  <rect x="16" y="16" width="1168" height="528" rx="10" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5"/>

  <text x="40" y="50" fill="#06B6D4" font-size="18" font-weight="bold" letter-spacing="1.2">SPECTRA PHASE 3 HYBRID RUST + PYTHON ARCHITECTURE</text>
  <text x="40" y="70" fill="#94A3B8" font-size="11.5">Single-Window Native Desktop Shell, Embedded Rust HTTP Gateway, &amp; Deterministic Core Engine (Build 20261114.0020)</text>

  <!-- Layer 1: Native Desktop Shell -->
  <rect x="40" y="96" width="1120" height="100" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="1.4"/>
  <text x="60" y="122" fill="#67E8F9" font-size="13" font-weight="bold">LAYER 1: NATIVE DESKTOP SHELL (`crates/spectra-shell`)</text>
  <text x="60" y="144" fill="#E2E8F0" font-size="11">• tao + wry native window hosting WebView2 (Windows) / WebKitGTK (Linux) — single window &amp; taskbar SPECTRA icon</text>
  <text x="60" y="162" fill="#CBD5E1" font-size="10.5">• Remembers maximized state &amp; geometry in window_state.json; assigns AppUserModelID ("SPECTRA.Diagnostics.Suite")</text>
  <text x="60" y="180" fill="#94A3B8" font-size="10">• Launches cleanly via spectra.exe (Win32 GUI subsystem + splash) or run_ui.sh; supports standalone `--pure-rust` flag</text>

  <line x1="600" y1="196" x2="600" y2="226" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrC)"/>

  <!-- Layer 2: Embedded Rust HTTP Gateway -->
  <rect x="40" y="232" width="1120" height="122" rx="8" fill="#0F172A" stroke="#A855F7" stroke-width="1.4"/>
  <text x="60" y="258" fill="#E9D5FF" font-size="13" font-weight="bold">LAYER 2: EMBEDDED RUST HTTP GATEWAY (`crates/spectra-agent/src/http_gateway.rs`)</text>

  <rect x="60" y="274" width="520" height="66" rx="6" fill="#090D16" stroke="#334155"/>
  <text x="76" y="294" fill="#67E8F9" font-size="11" font-weight="bold">Native Rust Control Plane (Zero Latency)</text>
  <text x="76" y="312" fill="#CBD5E1" font-size="10">• Serves React UI (`web/dist/`), `/api/version`,</text>
  <text x="76" y="328" fill="#CBD5E1" font-size="10">  `/api/app/heartbeat`, &amp; `/api/debug/*` logs natively</text>

  <rect x="600" y="274" width="540" height="66" rx="6" fill="#090D16" stroke="#334155"/>
  <text x="616" y="294" fill="#C084FC" font-size="11" font-weight="bold">Dual Execution Mode (`--pure-rust` vs Hybrid)</text>
  <text x="616" y="312" fill="#CBD5E1" font-size="10">• `--pure-rust`: Handles `/api/ports`, `/api/machines`, `/api/command` directly</text>
  <text x="616" y="328" fill="#CBD5E1" font-size="10">• Hybrid: Reverse-proxies `/api/stats`, `/api/ai/*`, `/api/hmi/*` to Python sidecar</text>

  <line x1="320" y1="354" x2="320" y2="384" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrC)"/>
  <line x1="880" y1="354" x2="880" y2="384" stroke="#A855F7" stroke-width="2" marker-end="url(#arrP)"/>

  <!-- Layer 3 Left: Rust Core & HAL + PyO3 -->
  <rect x="40" y="390" width="545" height="134" rx="8" fill="#091512" stroke="#10B981" stroke-width="1.4"/>
  <text x="60" y="416" fill="#6EE7B7" font-size="13" font-weight="bold">LAYER 3A: DETERMINISTIC RUST CORE &amp; HAL</text>
  <text x="60" y="438" fill="#E2E8F0" font-size="10.5">• `crates/spectra-core`: 4:1 UART codec, `@`-cipher S-box,</text>
  <text x="60" y="454" fill="#E2E8F0" font-size="10.5">  NTC/date decoders, `correlate_with_joe_ranked`, machine matcher</text>
  <text x="60" y="474" fill="#CBD5E1" font-size="10.5">• `crates/spectra-hal`: Serial transport, port scan, 8ms/16ms pacing</text>
  <text x="60" y="494" fill="#67E8F9" font-size="10.5">• `crates/spectra-py`: Native C-ABI (`spectra_py.so` / `.pyd`)</text>

  <!-- Layer 3 Right: Python Domain Sidecar -->
  <rect x="615" y="390" width="545" height="134" rx="8" fill="#160F24" stroke="#F59E0B" stroke-width="1.4"/>
  <text x="635" y="416" fill="#FCD34D" font-size="13" font-weight="bold">LAYER 3B: PYTHON SIDECAR ORCHESTRATOR</text>
  <text x="635" y="438" fill="#E2E8F0" font-size="10.5">• `web_server.py` + Multi-Vendor Drivers (Jura, Nivona, Kalerm, Jetinno)</text>
  <text x="635" y="456" fill="#CBD5E1" font-size="10.5">• `spectra_ai.py`: Local AI triage, customer notes &amp; Vision OCR</text>
  <text x="635" y="474" fill="#CBD5E1" font-size="10.5">• `machine_library.py` &amp; `profiles_db.py`: 172 Profiles + Overrides</text>
  <text x="635" y="492" fill="#CBD5E1" font-size="10.5">• `hmi_inspector.py` &amp; `github_auth.py`: Firmware &amp; OAuth/PAT Sync</text>
</svg>
