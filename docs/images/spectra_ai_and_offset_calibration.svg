<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090F"/>
      <stop offset="100%" stop-color="#0D1322"/>
    </linearGradient>
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L6,4 L0,7 Z" fill="#06B6D4"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,1 L6,4 L0,7 Z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg2)"/>
  <rect x="16" y="16" width="1168" height="688" rx="10" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5"/>

  <text x="40" y="50" fill="#A855F7" font-size="18" font-weight="bold" letter-spacing="1.2">LOCAL AI SETUP &amp; EEPROM OFFSET CALIBRATION PIPELINE</text>
  <text x="40" y="70" fill="#94A3B8" font-size="11.5">Zero-Bloat Default-OFF Local AI Runtime + CSV / Screenshot Register Offset Fixer (172 Machine Profiles)</text>

  <!-- LEFT COLUMN: LOCAL AI SETUP -->
  <rect x="40" y="92" width="540" height="590" rx="8" fill="#0F172A" stroke="#A855F7" stroke-width="1.3"/>
  <text x="60" y="120" fill="#E9D5FF" font-size="14" font-weight="bold">PART A: CONFIG -&gt; LOCAL AI &amp; MODELS</text>

  <!-- Card 1: Default OFF -->
  <rect x="60" y="138" width="500" height="88" rx="6" fill="#090D16" stroke="#334155"/>
  <text x="76" y="160" fill="#FFFFFF" font-size="12" font-weight="bold">1. Strict Opt-In Engine (Default: OFF)</text>
  <rect x="355" y="146" width="190" height="22" rx="4" fill="#18181B" stroke="#52525B"/>
  <text x="450" y="161" fill="#A1A1AA" font-size="10" font-weight="bold" text-anchor="middle">OFF (DEFAULT • 0 CPU/RAM)</text>
  <text x="76" y="182" fill="#CBD5E1" font-size="10.5">Consumes 0 MB RAM until explicitly enabled.</text>
  <text x="76" y="200" fill="#94A3B8" font-size="10">Click CONFIG -&gt; ENABLE LOCAL AI (or Tab 01 toggle).</text>
  <text x="76" y="216" fill="#67E8F9" font-size="10">Host probe checks RAM, AVX2 SIMD &amp; GPU automatically.</text>

  <!-- Arrow -->
  <line x1="310" y1="226" x2="310" y2="248" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Card 2: Model Choice -->
  <rect x="60" y="254" width="500" height="122" rx="6" fill="#090D16" stroke="#06B6D4"/>
  <text x="76" y="276" fill="#67E8F9" font-size="12" font-weight="bold">2. Choose Model Tag &amp; Click [Pull Model]</text>
  <text x="76" y="298" fill="#E2E8F0" font-size="10.5">• qwen2.5:0.5b    (~400 MB)  Ultra-light CPU bench triage</text>
  <text x="76" y="316" fill="#E2E8F0" font-size="10.5">• gemma3:1b       (~815 MB)  Fast diagnostics &amp; summaries</text>
  <text x="76" y="334" fill="#E2E8F0" font-size="10.5">• qwen2.5:1.5b    (~986 MB)  Balanced 8-12 GB hosts</text>
  <text x="76" y="352" fill="#C084FC" font-size="10.5">• gemma3:4b       (Vision)   Required for Screenshot OCR</text>
  <text x="76" y="368" fill="#94A3B8" font-size="9.5">Custom Gemma/HF GGUF tags can also be typed directly.</text>

  <!-- Arrow -->
  <line x1="310" y1="376" x2="310" y2="398" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Card 3: 3-Step Auto-Install -->
  <rect x="60" y="404" width="500" height="136" rx="6" fill="#090D16" stroke="#10B981"/>
  <text x="76" y="426" fill="#6EE7B7" font-size="12" font-weight="bold">3. Automated 3-Step Portable Installer</text>
  <text x="76" y="446" fill="#CBD5E1" font-size="10">Step 1/3: Installs user-space runtime (~/.local/share/spectra</text>
  <text x="76" y="460" fill="#CBD5E1" font-size="10">          or %LOCALAPPDATA%\SPECTRA) via OS TLS / SChannel.</text>
  <text x="76" y="478" fill="#CBD5E1" font-size="10">Step 2/3: Starts background runtime on 127.0.0.1:11434.</text>
  <text x="76" y="496" fill="#CBD5E1" font-size="10">Step 3/3: Pulls weights with live MB/s &amp; ETA bar.</text>
  <!-- Progress Bar -->
  <rect x="76" y="512" width="468" height="14" rx="4" fill="#1E293B"/>
  <rect x="76" y="512" width="380" height="14" rx="4" fill="url(#cyanBar)"/>
  <text x="540" y="523" fill="#67E8F9" font-size="10" font-weight="bold" text-anchor="end">81%</text>

  <!-- Arrow -->
  <line x1="310" y1="540" x2="310" y2="562" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Card 4: Execution -->
  <rect x="60" y="568" width="500" height="96" rx="6" fill="#160B29" stroke="#A855F7"/>
  <text x="76" y="590" fill="#E9D5FF" font-size="12" font-weight="bold">4. Run Bench Triage &amp; Customer Summary</text>
  <text x="76" y="610" fill="#E2E8F0" font-size="10.5">• [RUN AI BENCH TRIAGE]: Severity, causes &amp; bench checks</text>
  <text x="76" y="628" fill="#E2E8F0" font-size="10.5">• [GENERATE CUSTOMER SUMMARY]: Clear repair handoff note</text>
  <text x="76" y="646" fill="#94A3B8" font-size="10">Auto-unload option frees weights immediately after each task.</text>

  <!-- RIGHT COLUMN: EEPROM OFFSET FIXER -->
  <rect x="610" y="92" width="550" height="590" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.3"/>
  <text x="630" y="120" fill="#FCD34D" font-size="14" font-weight="bold">PART B: FIX EEPROM OFFSETS &amp; CALIBRATE</text>

  <!-- Step 1 -->
  <rect x="630" y="138" width="510" height="72" rx="6" fill="#090D16" stroke="#334155"/>
  <text x="646" y="160" fill="#FFFFFF" font-size="12" font-weight="bold">1. Interrogate Connected Machine (RT:0000..01F0)</text>
  <text x="646" y="180" fill="#CBD5E1" font-size="10.5">Click INTERROGATE in top bar (or Capture Diagnostic Bundle</text>
  <text x="646" y="196" fill="#94A3B8" font-size="10">in EXPORT) so SPECTRA holds the machine's 512 raw EEPROM words.</text>

  <line x1="885" y1="210" x2="885" y2="232" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Step 2 -->
  <rect x="630" y="238" width="510" height="96" rx="6" fill="#090D16" stroke="#F59E0B"/>
  <text x="646" y="260" fill="#FCD34D" font-size="12" font-weight="bold">2. Upload J.O.E. / Legacy CSV or Screenshot</text>
  <text x="646" y="280" fill="#E2E8F0" font-size="10.5">In Tab 01 Offset Calibrator (or EXPORT modal):</text>
  <text x="646" y="298" fill="#67E8F9" font-size="10.5">• CSV (.csv/.txt): J.O.E. export or legacy Jura Service table</text>
  <text x="646" y="316" fill="#C084FC" font-size="10.5">• Image (.png/.jpg): Screenshot parsed via gemma3:4b / OCR</text>

  <line x1="885" y1="334" x2="885" y2="356" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Step 3 -->
  <rect x="630" y="362" width="510" height="146" rx="6" fill="#090D16" stroke="#06B6D4"/>
  <text x="646" y="384" fill="#67E8F9" font-size="12" font-weight="bold">3. Click [CALIBRATE OFFSETS] — Rust + AI Match</text>
  <text x="646" y="404" fill="#CBD5E1" font-size="10">Rust core (correlate_with_joe_ranked) sweeps 16-bit Big-Endian</text>
  <text x="646" y="418" fill="#CBD5E1" font-size="10">(ABCD) &amp; 32-bit Word-Swapped (CDAB) counters; AI maps names:</text>

  <rect x="646" y="430" width="478" height="64" rx="4" fill="#04070D" stroke="#1E293B"/>
  <text x="658" y="447" fill="#6EE7B7" font-size="10">Espresso (J.O.E.: 1,420)  -&gt; 0x0000 [16b BE]  CONF: 1.00</text>
  <text x="658" y="463" fill="#6EE7B7" font-size="10">Coffee   (J.O.E.: 3,812)  -&gt; 0x0002 [16b BE]  CONF: 1.00</text>
  <text x="658" y="479" fill="#FCD34D" font-size="10">Cleanings(J.O.E.: 84)     -&gt; 0x001E [32b CDAB] PREPS: 0 -&gt; 5,232</text>

  <line x1="885" y1="508" x2="885" y2="530" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Step 4 -->
  <rect x="630" y="536" width="510" height="128" rx="6" fill="#090D16" stroke="#10B981"/>
  <text x="646" y="558" fill="#6EE7B7" font-size="12" font-weight="bold">4. Apply Locally, Inspect Library &amp; Contribute</text>
  <rect x="646" y="572" width="150" height="28" rx="4" fill="#065F46" stroke="#10B981"/>
  <text x="721" y="590" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">APPLY LOCALLY NOW</text>

  <rect x="806" y="572" width="166" height="28" rx="4" fill="#0369A1" stroke="#38BDF8"/>
  <text x="889" y="590" fill="#FFFFFF" font-size="10" font-weight="bold" text-anchor="middle">CONTRIBUTE TO REPO</text>

  <rect x="982" y="572" width="142" height="28" rx="4" fill="#1E293B" stroke="#64748B"/>
  <text x="1053" y="590" fill="#E2E8F0" font-size="10" font-weight="bold" text-anchor="middle">EXPORT .JSON</text>

  <text x="646" y="620" fill="#CBD5E1" font-size="10">• Saves override to ~/.config/spectra/eeprom_overrides.json</text>
  <text x="646" y="636" fill="#CBD5E1" font-size="10">• Priority: Local Override &gt; Verified Spec &gt; Built-in Profile</text>
  <text x="646" y="652" fill="#94A3B8" font-size="10">• Share via GitHub or .spectra.offset_patch.v1 JSON file</text>
</svg>
