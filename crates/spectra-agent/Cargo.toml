[package]
name = "spectra-agent"
version = "0.1.0"
edition = "2021"
description = "Tauri v2 IPC backend and async agent runtime for SPECTRA diagnostics"

[features]
default = []
tauri-native = ["dep:tauri"]

[dependencies]
spectra-hal = { path = "../spectra-hal", features = ["serial"] }
spectra-core = { path = "../spectra-core" }
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2.0", optional = true }
