[package]
name = "spectra-agent"
version = "0.1.0"
edition = "2021"
description = "Tauri v2 IPC backend and async agent runtime for SPECTRA diagnostics"

[features]
default = []

[dependencies]
spectra-hal = { path = "../spectra-hal", features = ["serial"] }
spectra-core = { path = "../spectra-core" }
tokio = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
